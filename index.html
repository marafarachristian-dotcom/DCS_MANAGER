<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCS Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d6fa5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DCS Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#6b7684;--bd:#dde2e8;--pri:#1d6fa5;--ok:#1f8f4e;--wa:#d98a00;--ko:#cc3b3b;--okb:#e3f4ea;--wab:#fdf1d9;--kob:#fbe4e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181e;--card:#1c222b;--tx:#e6eaf0;--mut:#98a2b0;--bd:#2d3643;--pri:#5aaee6;--ok:#4cc27f;--wa:#e9b04a;--ko:#ef7a7a;--okb:#16301f;--wab:#3a2e12;--kob:#3b1c1c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:12px;opacity:.9}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;min-width:0}
button.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border-radius:12px;padding:12px;border:1px solid var(--bd);background:var(--card)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:26px}.kpi span{font-size:11px;color:var(--mut)}
.kpi.ok{background:var(--okb)}.kpi.wa{background:var(--wab)}.kpi.ko{background:var(--kob)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
.t.ok{color:var(--ok);font-weight:600}.t.wa{color:var(--wa);font-weight:600}.t.ko{color:var(--ko);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--wab);color:var(--wa)}.tag.v{background:var(--okb);color:var(--ok)}
.al{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;border-left:4px solid}.al.ko{background:var(--kob);border-color:var(--ko)}.al.wa{background:var(--wab);border-color:var(--wa)}.msg{font-size:13px;margin-top:8px;color:var(--wa)}.note{font-size:12px;color:var(--mut)}
svg text{fill:var(--mut);font-size:10px}
@media print{:root{--bg:#fff!important;--card:#fff!important;--tx:#000!important;--mut:#444!important;--bd:#bbb!important;--ok:#146c38!important;--wa:#9a6200!important;--ko:#a42424!important;--okb:#fff!important;--wab:#fff!important;--kob:#fff!important}
header,nav,.np{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{break-inside:avoid;border-radius:0}.sc{overflow:visible}}
#btn-install{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:none;background:var(--pri);color:#fff;border:0;border-radius:24px;padding:10px 16px;font:600 14px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
@media print{#btn-install{display:none!important}}
</style>
</head>
<body>
<header><h1>DCS manager</h1><p>Version complète · Tableau de bord · PEV · SMI · Paludisme · Surveillance · Stocks · Supervision · Rapports</p></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
/* ===== 1. CONFIGURATION : un programme = un formulaire + des indicateurs (SMI et paludisme sont des variantes du PEV) ===== */
var PROGS=[
{id:"pev",label:"PEV",form:[["dtc1","DTC1"],["dtc3","DTC3"],["var","VAR"],["vpo3","VPO3"]],checks:[["dtc3","dtc1","DTC3 supérieur à DTC1"]]},
{id:"smi",label:"SMI",form:[["cpn1","CPN1"],["cpn4","CPN4"],["acc_tot","Accouchements"],["acc_ass","Accouchements assistés"],["cpon","Consultations postnatales"],["pf","Nouvelles utilisatrices PF"]],
 checks:[["cpn4","cpn1","CPN4 supérieur à CPN1"],["acc_ass","acc_tot","Accouchements assistés supérieurs aux accouchements"]]},
{id:"palu",label:"Paludisme",form:[["suspects","Cas suspects"],["testes","Cas testés (TDR/GE)"],["positifs","Cas confirmés"],["graves","Cas graves"],["deces","Décès"]],
 checks:[["testes","suspects","Cas testés supérieurs aux suspects"],["positifs","testes","Cas confirmés supérieurs aux testés"],["graves","positifs","Cas graves supérieurs aux confirmés"],["deces","positifs","Décès supérieurs aux cas confirmés"]]}];
var POPF=[["u1","Enfants < 1 an (naissances attendues)"],["gross","Grossesses attendues"],["far","Femmes en âge de procréer"],["tot","Population totale"]];
/* C(programme, id, libellé, numérateur, dénominateur (clé de population ou fonction), sens, objectif, seuil d'alerte, centre en difficulté si rouge, multiplicateur)
   Seuils PROVISOIRES : à remplacer par les critères de la direction. dir "info" = suivi sans couleur. */
function C(p,id,l,n,d,dir,t,w,fl,m){return{p:p,id:id,label:l,num:n,d:d,dir:dir,target:t,warn:w,flag:fl,mult:m||100}}
var INDICATORS=[
C("pev","dtc1","Couverture DTC1",s=>s.dtc1,"u1","up",90,80,0),
C("pev","dtc3","Couverture DTC3",s=>s.dtc3,"u1","up",90,80,1),
C("pev","var","Couverture VAR",s=>s["var"],"u1","up",90,80,1),
C("pev","vpo3","Couverture VPO3",s=>s.vpo3,"u1","up",90,80,0),
C("pev","drop","Abandon DTC1–DTC3",s=>s.dtc1-s.dtc3,s=>s.dtc1,"down",10,20,1),
C("smi","cpn1","CPN1 (% des grossesses attendues)",s=>s.cpn1,"gross","up",90,80,1),
C("smi","cpn4","CPN4 (% des grossesses attendues)",s=>s.cpn4,"gross","up",60,40,1),
C("smi","accass","Accouchements assistés",s=>s.acc_ass,"u1","up",80,60,1),
C("smi","cpon","Consultations postnatales",s=>s.cpon,"u1","up",60,40,0),
C("smi","pf","Nouvelles utilisatrices PF (% des FAR)",s=>s.pf,"far","info",null,null,0),
C("palu","teste","Cas suspects testés",s=>s.testes,s=>s.suspects,"up",95,80,1),
C("palu","posit","Taux de positivité",s=>s.positifs,s=>s.testes,"info",null,null,0),
C("palu","grav","Proportion de cas graves",s=>s.graves,s=>s.positifs,"info",null,null,0),
C("palu","letal","Létalité (décès / cas confirmés)",s=>s.deces,s=>s.positifs,"down",1,3,1),
C("palu","letalg","Létalité des cas graves",s=>s.deces,s=>s.graves,"info",null,null,0),
C("palu","inc","Incidence (cas confirmés pour 1 000 hab.)",s=>s.positifs,"tot","info",null,null,0,1000)];
var MOIS=["Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov","Déc"];
var KEY="dcs_etape6_v1",S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("dcs_etape5_v1")||localStorage.getItem("dcs_etape4_v1")||localStorage.getItem("dcs_etape3_v1")||localStorage.getItem("dcs_etape2_v1"))}catch(e){S=null}
 if(S){S.notif=S.notif||[];S.inv=S.inv||[];S.mv=S.mv||[];S.prod=S.prod||defProds();S.sup=S.sup||[];S.reco=S.reco||[];S.hist=S.hist||[];S.rh=S.rh||[];S.eq=S.eq||{};S.infra=S.infra||{}}
 if(!S){S={centres:[{id:"c1",nom:"CS Kipé",commune:"Ratoma"},{id:"c2",nom:"CS Dar-es-Salam",commune:"Ratoma"},{id:"c3",nom:"CS Hamdallaye",commune:"Ratoma"},{id:"c4",nom:"CS Nongo",commune:"Ratoma"},{id:"c5",nom:"CS Taouyah",commune:"Ratoma"},{id:"c6",nom:"CS Sonfonia",commune:"Ratoma"}],pop:{},rec:{},camp:[],notif:[],inv:[],mv:[],prod:defProds(),sup:[],reco:[],hist:[],rh:[],eq:{},infra:{}};
  var b={c1:1500,c2:1100,c3:1300,c4:900,c5:1000,c6:800};
  S.centres.forEach(c=>{var u=b[c.id];S.pop[c.id+"|2026"]={u1:u,gross:Math.round(u*1.05),far:Math.round(u*6.5),tot:u*28}})}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
var UI={tab:"dash",year:2026,m1:1,m2:10,commune:"",onlyVal:true,ind:"dtc3",pp:"pev",sp:"pev",dp:"all",dprog:"all",msg:""};

/* ===== 2. MOTEUR D'INDICATEURS (commun aux trois programmes) ===== */
function PROG(id){return PROGS.filter(p=>p.id===id)[0]}
function ind(id){return INDICATORS.filter(i=>i.id===id)[0]}
function INDS(p){return INDICATORS.filter(i=>i.p===p)}
function scope(){return S.centres.filter(c=>!UI.commune||c.commune===UI.commune)}
function rk(p,c,y,m){return p+"|"+c+"|"+y+"-"+(m<10?"0":"")+m}
function aggregate(pid,cs,y,m1,m2,ov){var P=PROG(pid),s={},pop={u1:0,gross:0,far:0,tot:0},n=0;P.form.forEach(f=>s[f[0]]=0);
 cs.forEach(c=>{var pp=S.pop[c.id+"|"+y]||{};for(var k in pop)pop[k]+=(pp[k]||0)*(m2-m1+1)/12;
  for(var m=m1;m<=m2;m++){var r=S.rec[rk(pid,c.id,y,m)];if(r&&(!ov||r.status==="valide")){n++;P.form.forEach(f=>s[f[0]]+=Number(r.values[f[0]])||0)}}});
 return{s:s,pop:pop,n:n}}
function compute(i,a){var d=typeof i.d==="string"?a.pop[i.d]:i.d(a.s);return d?i.num(a.s)/d*i.mult:null}
function status(i,v){if(v===null||i.dir==="info")return "";if(i.dir==="down")return v<=i.target?"ok":v<=i.warn?"wa":"ko";return v>=i.target?"ok":v>=i.warn?"wa":"ko"}
function fmt(i,v){if(arguments.length===1){v=i;i=null}if(v===null)return "–";return v.toFixed(1)+(i&&i.mult===1000?" ‰":" %")}
function tgt(i){return i.dir==="info"?"indicateur de suivi":(i.dir==="up"?"objectif ≥ ":"objectif ≤ ")+i.target+(i.mult===1000?" ‰":" %")}
function received(pid,c){var n=0;for(var m=UI.m1;m<=UI.m2;m++){var r=S.rec[rk(pid,c.id,UI.year,m)];if(r&&r.status==="valide")n++}return n}
function checks(pid,v){return PROG(pid).checks.filter(k=>(+v[k[0]]||0)>(+v[k[1]]||0)).map(k=>k[2])}
/* Centres en difficulté : indicateurs rouges marqués « flag » + rapports validés manquants */
function difficulties(pf){var out=[],E=UI.m2-UI.m1+1;
 scope().forEach(c=>{var f=[],sc=null;
  PROGS.filter(P=>pf==="all"||P.id===pf).forEach(P=>{var a=aggregate(P.id,[c],UI.year,UI.m1,UI.m2,UI.onlyVal);
   INDS(P.id).forEach(i=>{if(!i.flag)return;var v=compute(i,a);if(status(i,v)==="ko"){f.push(P.label+" · "+i.label.replace("Couverture ","").replace(/ \(.*\)/,"")+" "+fmt(i,v));if(i.id==="dtc3")sc=v}});
   var rc=received(P.id,c);if(rc<E)f.push("Rapports "+P.label+" validés : "+rc+"/"+E)});
  if(f.length)out.push({c:c,f:f,sc:sc===null?999:sc})});
 return out.sort((a,b)=>b.f.length-a.f.length||a.sc-b.sc)}
function campStats(list){var t={cible:0,vac:0,sp:0,sr:0};list.forEach(function(k){t.cible+=+k.cible||0;t.vac+=+k.vac||0;t.sp+=+k.sp||0;t.sr+=+k.sr||0});return t}
function campScope(){return S.camp.filter(function(k){var c=S.centres.filter(function(x){return x.id===k.centre})[0];return k.date&&k.date.slice(0,4)==UI.year&&(!UI.commune||(c&&c.commune===UI.commune))})}


/* ===== 3. INTERFACE ===== */
var TABS=[["dash","Tableau de bord"],["saisie","Saisie mensuelle"],["camp","Campagnes & AV"],["diff","Centres en difficulté"],["surv","Surveillance"],["inv","Investigations"],["stock","Stocks"],["mouv","Mouvements"],["sup","Supervision"],["reco","Recommandations"],["rh","RH & infrastructures"],["rap","Rapports"],["donnees","Données & validation"],["param","Centres & populations"]];
function nav(){document.getElementById("nav").innerHTML=TABS.map(x=>'<button data-t="'+x[0]+'" class="'+(UI.tab===x[0]?"on":"")+'">'+x[1]+'</button>').join("");
 [].forEach.call(document.querySelectorAll("#nav button"),b=>{b.onclick=()=>{UI.tab=b.dataset.t;UI.msg="";UI.gid=null;UI.vid=null;UI.hv=null;render()}})}
function render(){nav();document.getElementById("app").innerHTML=({dash:vDash,saisie:vSaisie,camp:vCamp,diff:vDiff,surv:vSurv,inv:vInv,stock:vStock,mouv:vMouv,sup:vSup,reco:vReco,rap:vRap,rh:vRh,donnees:vDonnees,param:vParam})[UI.tab]();bind()}
function filters(){
 var cm=[];S.centres.forEach(function(c){if(cm.indexOf(c.commune)<0)cm.push(c.commune)});
 var mo=function(sel){return MOIS.map(function(m,i){return '<option value="'+(i+1)+'"'+(sel===i+1?" selected":"")+'>'+m+'</option>'}).join("")};
 return '<div class="card"><div class="row"><label>Année<input id="f_year" type="number" value="'+UI.year+'" style="width:90px"></label>'+
 '<label>Du mois<select id="f_m1">'+mo(UI.m1)+'</select></label><label>Au mois<select id="f_m2">'+mo(UI.m2)+'</select></label>'+
 '<label>Commune<select id="f_d"><option value="">Toutes</option>'+cm.map(function(d){return '<option'+(UI.commune===d?" selected":"")+'>'+d+'</option>'}).join("")+'</select></label>'+
 '<label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="f_v"'+(UI.onlyVal?" checked":"")+'> Données validées seulement</label></div></div>';
}
function progSel(id,v,all){return '<label>Programme<select id="'+id+'">'+(all?'<option value="all">Tous</option>':"")+PROGS.map(p=>'<option value="'+p.id+'"'+(v===p.id?" selected":"")+'>'+p.label+'</option>').join("")+'</select></label>'}
function vDash5(){
 var cs=scope(),D=difficulties("all"),h=filters();
 h+='<div class="card"><h2>Situation sanitaire de la commune'+(UI.commune?" de "+UI.commune:"")+'</h2><p class="note" style="margin:0">'+cs.length+' centre(s) · '+D.length+' en difficulté · seuils provisoires, modifiables dans la configuration</p></div>';
 PROGS.forEach(P=>{var a=aggregate(P.id,cs,UI.year,UI.m1,UI.m2,UI.onlyVal);
  h+='<div class="card"><h2>'+P.label+'</h2><p class="note" style="margin:0 0 8px">'+a.n+' rapport(s) mensuel(s) pris en compte</p><div class="kpis" style="margin:0">'+
  INDS(P.id).map(i=>{var v=compute(i,a);return '<div class="kpi '+status(i,v)+'"><small>'+i.label+'</small><b>'+fmt(i,v)+'</b><span>'+tgt(i)+'</span></div>'}).join("")+'</div></div>'});
 h+=survCard()+stockCard()+supCard()+rhCard();var A=D.map(x=>({k:x.f.length>=2?"ko":"wa",t:"<b>"+x.c.nom+"</b> : "+x.f.join(" · ")})),cp=campStats(campScope());survAlerts().forEach(x=>A.push(x));stockAlerts().forEach(x=>A.push(x));supAlerts().forEach(x=>A.push(x));rhAlerts().forEach(x=>A.push(x));
 if(cp.cible&&cp.vac/cp.cible*100<80)A.push({k:"wa",t:"<b>Campagnes / AV</b> : réalisation "+(cp.vac/cp.cible*100).toFixed(0)+" % de la cible (< 80)"});
 A.sort((x,y)=>(x.k==="ko"?0:1)-(y.k==="ko"?0:1));
 h+='<div class="card"><h2>Alertes et problèmes prioritaires</h2>'+(A.length?A.slice(0,8).map(x=>'<div class="al '+x.k+'">'+x.t+'</div>').join("")+(A.length>8?'<p class="note">+ '+(A.length-8)+' autre(s) dans « Centres en difficulté ».</p>':""):'<p class="note">Aucune alerte sur la période. Les alertes de surveillance et de stocks s’ajouteront aux étapes 3 et 4.</p>')+'</div>';
 var P=PROG(UI.pp),I=INDS(P.id),at=aggregate(P.id,cs,UI.year,UI.m1,UI.m2,UI.onlyVal);
 h+='<div class="card"><h2>Performances des centres de santé</h2><div class="row" style="margin-bottom:8px">'+progSel("f_pp",UI.pp)+'</div><div class="sc"><table><tr><th>Centre</th>'+I.map(i=>'<th title="'+i.label+'">'+i.label.replace("Couverture ","").replace(/ \(.*\)/,"")+'</th>').join("")+'</tr>'+
 cs.map(c=>{var ca=aggregate(P.id,[c],UI.year,UI.m1,UI.m2,UI.onlyVal);return '<tr><td>'+c.nom+'</td>'+I.map(i=>{var v=compute(i,ca);return '<td class="t '+status(i,v)+'">'+fmt(i,v)+'</td>'}).join("")+'</tr>'}).join("")+
 '<tr style="font-weight:700"><td>Commune</td>'+I.map(i=>{var v=compute(i,at);return '<td class="t '+status(i,v)+'">'+fmt(i,v)+'</td>'}).join("")+'</tr></table></div><p class="note">Couleurs : vert = objectif atteint, orange = sous l’objectif, rouge = sous le seuil d’alerte. Les indicateurs « de suivi » n’ont pas de couleur.</p></div>';
 h+='<div class="card"><h2>Évolution mensuelle '+UI.year+'</h2><label style="margin-bottom:8px;max-width:340px">Indicateur<select id="f_i">'+PROGS.map(p=>'<optgroup label="'+p.label+'">'+INDS(p.id).map(i=>'<option value="'+i.id+'"'+(UI.ind===i.id?" selected":"")+'>'+i.label+'</option>').join("")+'</optgroup>').join("")+'</select></label>'+trend(cs)+'</div>';
 return h}
function trend(cs){var I=ind(UI.ind),pts=[],W=640,H=200,L=34,B=24,T=10;
 for(var m=1;m<=12;m++){var a=aggregate(I.p,cs,UI.year,m,m,UI.onlyVal);pts.push(a.n?compute(I,a):null)}
 var mx=Math.max(10,(I.target||0),Math.max.apply(null,pts.map(v=>v||0)))*1.1,u=I.mult===1000?"‰":"%";
 var x=i=>L+i*(W-L-10)/11,y=v=>T+(H-T-B)*(1-v/mx);
 var s='<div class="sc"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:480px">';
 [0,I.target,Math.round(mx)].forEach(g=>{if(g===null)return;s+='<line x1="'+L+'" x2="'+(W-10)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="'+(g===I.target?"#1f8f4e":"#8884")+'" stroke-dasharray="'+(g===I.target?"4 3":"0")+'"/><text x="2" y="'+(y(g)+3)+'">'+g+u+'</text>'});
 var d="",pen=false;pts.forEach((v,i)=>{if(v===null){pen=false;return}d+=(pen?"L":"M")+x(i)+" "+y(v)+" ";pen=true});
 s+='<path d="'+d+'" fill="none" stroke="#1d6fa5" stroke-width="2.5"/>';
 pts.forEach((v,i)=>{s+='<text x="'+(x(i)-9)+'" y="'+(H-8)+'">'+MOIS[i]+'</text>';if(v!==null)s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.5" fill="#1d6fa5"/>'});
 return s+'</svg></div>'}
function vSaisie(){var P=PROG(UI.sp),now=new Date(),dm=now.getFullYear()+"-"+(now.getMonth()+1<10?"0":"")+(now.getMonth()+1);
 return '<div class="card"><h2>Saisie mensuelle</h2><div class="row">'+progSel("s_pg",UI.sp)+'<label>Centre<select id="s_c">'+S.centres.map(c=>'<option value="'+c.id+'">'+c.nom+'</option>').join("")+'</select></label><label>Mois<input type="month" id="s_p" value="'+(UI.lastP||dm)+'"></label></div>'+
 '<div class="grid" style="margin-top:12px">'+P.form.map(f=>'<label>'+f[1]+'<input type="number" min="0" inputmode="numeric" id="v_'+f[0]+'"></label>').join("")+'</div>'+
 '<div class="row" style="margin-top:12px"><button class="b s" id="s_draft">Enregistrer brouillon</button><button class="b" id="s_val">Enregistrer et valider</button></div><div class="msg" id="s_msg">'+UI.msg+'</div>'+
